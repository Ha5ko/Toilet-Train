; PlatformIO Configuration for ESP32-4848S040 Train Display
; Board: ESP32-S3 with 4" 480x480 ST7701 LCD

[env:esp32-4848S040]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Use Arduino ESP32 Core 3.x for compatibility
platform_packages =
    platformio/framework-arduinoespressif32@^3.20017.0

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi

; PSRAM configuration
board_build.arduino.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL configuration
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_COLOR_16_SWAP=0
    -DLV_MEM_SIZE=65536
    -DLV_TICK_CUSTOM=1
    -DLV_USE_LOG=1
    -DLV_LOG_PRINTF=1
    ; Enable fonts
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_22=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_32=1
    ; Enable widgets
    -DLV_USE_ARC=1
    -DLV_USE_BAR=1
    -DLV_USE_BTN=1
    -DLV_USE_BTNMATRIX=1
    -DLV_USE_CHECKBOX=1
    -DLV_USE_DROPDOWN=1
    -DLV_USE_IMG=1
    -DLV_USE_LABEL=1
    -DLV_USE_LINE=1
    -DLV_USE_ROLLER=1
    -DLV_USE_SLIDER=1
    -DLV_USE_SWITCH=1
    -DLV_USE_TEXTAREA=1
    -DLV_USE_TABLE=1
    -DLV_USE_ANIMIMG=1
    -DLV_USE_KEYBOARD=1
    -DLV_USE_LED=1
    -DLV_USE_LIST=1
    -DLV_USE_MSGBOX=1
    -DLV_USE_SPINNER=1
    -DLV_USE_SPAN=1
    ; Layouts
    -DLV_USE_FLEX=1
    -DLV_USE_GRID=1
    ; Theme
    -DLV_USE_THEME_DEFAULT=1
    -DLV_THEME_DEFAULT_DARK=1
    ; Display settings
    -DDISPLAY_WIDTH=480
    -DDISPLAY_HEIGHT=480
    ; JSON buffer size for API responses
    -DARDUINOJSON_ENABLE_PROGMEM=1
    ; WiFi Manager debug
    -DWIFI_MANAGER_DEBUG=1

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    ; Display library - use specific compatible version
    moononournation/GFX Library for Arduino@1.4.9
    ; LVGL graphics library
    lvgl/lvgl@^8.3.11
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.4
    ; WiFi Manager for captive portal
    https://github.com/tzapu/WiFiManager.git
    ; NTP time sync
    arduino-libraries/NTPClient@^3.2.1

; Extra build settings
build_unflags =
    -std=gnu++11
build_type = release
