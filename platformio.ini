; PlatformIO Configuration for ESP32-4848S040 Train Display
; Board: ESP32-S3 with 4" 480x480 ST7701 LCD

[env:esp32-4848S040]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; PSRAM configuration
board_build.arduino.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL configuration
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    ; Display settings
    -DDISPLAY_WIDTH=480
    -DDISPLAY_HEIGHT=480
    ; JSON buffer size for API responses
    -DARDUINOJSON_ENABLE_PROGMEM=1
    ; WiFi Manager debug
    -DWIFI_MANAGER_DEBUG=1

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    ; Display library
    moononournation/GFX Library for Arduino@^1.4.9
    ; LVGL graphics library
    lvgl/lvgl@^8.3.11
    ; Touch library
    https://github.com/moononournation/Arduino_GFX.git
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.4
    ; WiFi Manager for captive portal
    https://github.com/tzapu/WiFiManager.git
    ; HTTP client (built-in, but explicitly include)
    ; NTP time sync
    arduino-libraries/NTPClient@^3.2.1

; Extra build settings
build_unflags =
    -std=gnu++11
build_type = release
